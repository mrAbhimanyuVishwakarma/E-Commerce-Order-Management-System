# Aiven MySQL connection configuration for Production
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&sslMode=REQUIRED&trustCertificateKeyStoreUrl=file:${KAFKA_CA_CERT_PATH:/etc/secrets/ca.pem}&trustCertificateKeyStoreType=PEM
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
