# Aiven Kafka connection configuration for Production
spring.kafka.bootstrap-servers=axedrobe-abhimanyuvishwakarma9228-0b92.h.aivencloud.com:13451
spring.kafka.properties.security.protocol=SSL
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-certificates=file:${KAFKA_CA_CERT_PATH:./certs/ca.pem}
spring.kafka.ssl.key-store-type=PEM
spring.kafka.ssl.key-store-certificate-chain=file:${KAFKA_CERT_PATH:./certs/service.cert}
spring.kafka.ssl.key-store-key=file:${KAFKA_KEY_PATH:./certs/service.key}

# Aiven MySQL connection configuration for Production
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&sslMode=REQUIRED&trustCertificateKeyStoreUrl=file:${KAFKA_CA_CERT_PATH:./certs/ca.pem}&trustCertificateKeyStoreType=PEM
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
